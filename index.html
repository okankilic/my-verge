<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>My Verge — Bucket List & Reminder Journal</title>
    <meta name="description" content="An editorial mobile bucket list and reminder journal to store, organize, and remind life's aspirations across Go, Do, Buy, Remember, Read, and Watch." />
    <meta property="og:title" content="My Verge — Bucket List & Reminder Journal" />
    <meta property="og:description" content="An editorial mobile bucket list and reminder journal to store, organize, and remind life's aspirations across Go, Do, Buy, Remember, Read, and Watch." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved Light/Dark choice before first paint (key matches src/services/storage.ts)
      try {
        var t = localStorage.getItem('my_verge_theme_v1');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
